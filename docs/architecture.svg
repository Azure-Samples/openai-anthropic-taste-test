<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880"
     font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title>OpenAI + Anthropic Taste Test on Microsoft Foundry &#8212; architecture overview</title>
  <desc>A browser sends one prompt to a Blazor Server app on Azure Container Apps. The app uses a managed identity and Microsoft Entra ID to call GPT through the OpenAI Responses API and Claude through the Anthropic Messages API on one Microsoft Foundry account.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F9FD"/>
    </linearGradient>
    <linearGradient id="azure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF7FD"/>
      <stop offset="1" stop-color="#DCECF9"/>
    </linearGradient>
    <linearGradient id="entra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A2540" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5F9FCC"/>
    </marker>
  </defs>

  <rect width="1440" height="880" fill="url(#canvas)"/>

  <g transform="translate(720 52)" text-anchor="middle">
    <text y="0" font-size="32" font-weight="700" fill="#0A2540">OpenAI + Anthropic Taste Test on Microsoft Foundry</text>
    <text y="32" font-size="16" fill="#5A6B7C">One prompt &#183; two official SDKs &#183; one IChatClient path &#183; one azd up</text>
  </g>

  <g transform="translate(55 168)">
    <text x="0" y="-20" font-size="13" font-weight="700" letter-spacing="1" fill="#5A6B7C">BLIND EXPERIENCE</text>
    <rect width="330" height="130" rx="18" fill="#FFFFFF" stroke="#9FC4DF" filter="url(#shadow)"/>
    <circle cx="55" cy="65" r="30" fill="#E8F3FB"/>
    <path d="M40 66c8-13 22-13 30 0-8 13-22 13-30 0Z" fill="none" stroke="#0078D4" stroke-width="4"/>
    <circle cx="55" cy="66" r="6" fill="#0078D4"/>
    <text x="102" y="53" font-size="20" font-weight="700" fill="#0A2540">Audience browser</text>
    <text x="102" y="78" font-size="14" fill="#5A6B7C">One prompt &#8594; lanes A and B</text>
    <text x="102" y="100" font-size="14" fill="#5A6B7C">Vote, reveal, continue</text>

    <rect y="158" width="330" height="130" rx="18" fill="#FFFFFF" stroke="#9FC4DF" filter="url(#shadow)"/>
    <rect x="28" y="188" width="54" height="54" rx="9" fill="#D9FF63"/>
    <text x="55" y="224" text-anchor="middle" font-size="22" font-weight="800" fill="#17200A">A/B</text>
    <text x="102" y="210" font-size="20" font-weight="700" fill="#0A2540">Neutral rendering</text>
    <text x="102" y="235" font-size="14" fill="#5A6B7C">No provider data in the DOM</text>
    <text x="102" y="257" font-size="14" fill="#5A6B7C">Concurrent SignalR streaming</text>

    <rect y="316" width="330" height="130" rx="18" fill="#FFFFFF" stroke="#9FC4DF" filter="url(#shadow)"/>
    <path d="M35 371h40M55 351v40" stroke="#FF7B61" stroke-width="6" stroke-linecap="round"/>
    <text x="102" y="368" font-size="20" font-weight="700" fill="#0A2540">Winner continues</text>
    <text x="102" y="393" font-size="14" fill="#5A6B7C">Full history stays symmetric</text>
    <text x="102" y="415" font-size="14" fill="#5A6B7C">Usage + conversation hooks ready</text>
  </g>

  <g transform="translate(455 208)">
    <text x="145" y="-20" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#5A6B7C">UNIFIED .NET APP</text>
    <rect width="290" height="248" rx="20" fill="#FFFFFF" stroke="#7BB3DC" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="24" y="24" width="62" height="62" rx="14" fill="#512BD4"/>
    <text x="55" y="65" text-anchor="middle" font-size="25" font-weight="800" fill="#FFFFFF">.NET</text>
    <text x="105" y="49" font-size="21" font-weight="700" fill="#0A2540">Blazor Server</text>
    <text x="105" y="73" font-size="14" fill="#5A6B7C">Azure Container Apps</text>
    <line x1="24" y1="108" x2="266" y2="108" stroke="#D6E5F0"/>
    <text x="145" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#0078D4">Microsoft.Extensions.AI</text>
    <rect x="46" y="166" width="198" height="44" rx="10" fill="#0A2540"/>
    <text x="145" y="194" text-anchor="middle" font-family="'Cascadia Code', Consolas, monospace" font-size="15" fill="#D9FF63">IChatClient</text>

    <g transform="translate(40 294)">
      <text x="105" y="-18" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#5A6B7C">PASSWORDLESS AUTH</text>
      <rect width="210" height="150" rx="18" fill="#FFFFFF" stroke="#7BB3DC" filter="url(#shadow)"/>
      <circle cx="105" cy="52" r="35" fill="url(#entra)"/>
      <path d="M87 59l12-25 24 42H99Z" fill="#FFFFFF" opacity="0.92"/>
      <text x="105" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#0A2540">Microsoft Entra ID</text>
      <text x="105" y="130" text-anchor="middle" font-size="12" fill="#5A6B7C">managed identity bearer token</text>
    </g>
  </g>

  <g transform="translate(805 142)">
    <rect width="580" height="598" rx="22" fill="url(#azure)" stroke="#7BB3DC" stroke-width="1.6" filter="url(#shadow)"/>
    <text x="30" y="46" font-size="24" font-weight="700" fill="#0078D4">Azure</text>
    <text x="550" y="44" text-anchor="end" font-size="13" font-weight="700" letter-spacing="1" fill="#5A6B7C">AZD + BICEP</text>

    <g transform="translate(24 72)">
      <rect width="532" height="502" rx="17" fill="#FFFFFF" stroke="#9FC4DF"/>
      <rect x="22" y="20" width="54" height="54" rx="12" fill="#0078D4"/>
      <path d="M37 57l11-25 14 34H49Z" fill="#FFFFFF"/>
      <text x="94" y="44" font-size="22" font-weight="700" fill="#0A2540">Microsoft Foundry</text>
      <text x="94" y="66" font-size="13" fill="#5A6B7C">one account &#183; one project &#183; two protocols</text>

      <rect x="22" y="98" width="488" height="120" rx="13" fill="#F5FAFE" stroke="#C7DDF0"/>
      <rect x="40" y="118" width="68" height="68" rx="14" fill="#17200A"/>
      <text x="74" y="160" text-anchor="middle" font-size="20" font-weight="800" fill="#D9FF63">GPT</text>
      <text x="130" y="139" font-size="18" font-weight="700" fill="#0A2540">gpt-5.6-sol</text>
      <text x="130" y="164" font-size="13" fill="#5A6B7C">OpenAI SDK for .NET</text>
      <text x="130" y="188" font-family="'Cascadia Code', Consolas, monospace" font-size="12" fill="#0078D4">/openai/v1 &#183; Responses API</text>

      <rect x="22" y="232" width="488" height="120" rx="13" fill="#FFF8F4" stroke="#E8C6B6"/>
      <rect x="40" y="252" width="68" height="68" rx="14" fill="#D97757"/>
      <text x="74" y="294" text-anchor="middle" font-size="19" font-weight="800" fill="#FFFFFF">CL</text>
      <text x="130" y="273" font-size="18" font-weight="700" fill="#0A2540">claude-opus-5 &#183; v2</text>
      <text x="130" y="298" font-size="13" fill="#5A6B7C">Anthropic C# SDK &#183; Hosted on Azure</text>
      <text x="130" y="322" font-family="'Cascadia Code', Consolas, monospace" font-size="12" fill="#B75233">/anthropic &#183; Messages API</text>

      <g transform="translate(22 372)">
        <rect width="488" height="66" rx="12" fill="#EFF7FD" stroke="#C7DDF0"/>
        <text x="18" y="27" font-size="13" font-weight="700" fill="#0A2540">Provisioned together</text>
        <text x="18" y="48" font-size="12" fill="#5A6B7C">Container App &#183; ACR &#183; managed identity &#183; Log Analytics</text>
      </g>

      <rect x="22" y="451" width="488" height="34" rx="9" fill="#0A2540"/>
      <text x="266" y="473" text-anchor="middle" font-family="'Cascadia Code', Consolas, monospace" font-size="12" fill="#FFFFFF">https://{resource}.services.ai.azure.com</text>
    </g>
  </g>

  <g fill="none" stroke="#5F9FCC" stroke-width="2.2" marker-end="url(#arrow)">
    <path d="M385 233C420 233 426 300 454 300"/>
    <path d="M385 391C420 391 427 336 454 336"/>
    <path d="M745 332C776 332 778 314 804 314"/>
    <path d="M600 456V500"/>
    <path d="M705 577C760 577 764 442 804 442"/>
  </g>

  <g transform="translate(720 804)" text-anchor="middle">
    <text font-size="14" fill="#5A6B7C">
      <tspan font-weight="700" fill="#0A2540">Blind A/B</tspan>
      &#183; concurrent streaming &#183;
      <tspan font-weight="700" fill="#0A2540">Entra only</tspan>
      &#183; Hosted on Azure &#183;
      <tspan font-weight="700" fill="#0A2540">one-command deploy</tspan>
    </text>
  </g>
</svg>
