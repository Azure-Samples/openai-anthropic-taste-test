<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 720"
     font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title>One IChatClient, two official SDKs, two wire protocols on Microsoft Foundry</title>
  <desc>
    A .NET 10 application programs against a single Microsoft.Extensions.AI IChatClient. That one
    abstraction fans out to two lanes. The OpenAI lane uses the OpenAI SDK for .NET, calling
    GetResponsesClient().AsIChatClient() over the Responses API at the /openai/v1 route to a
    gpt-5.6-sol deployment of Azure OpenAI in Microsoft Foundry. The Anthropic lane uses the
    Anthropic C# SDK, calling AnthropicFoundryClient(...).AsIChatClient() over the Messages API at
    the /anthropic route to a claude-opus-5 deployment of Claude in Microsoft Foundry. Both lanes
    authenticate with Microsoft Entra ID and use no API keys.
  </desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F7FC"/>
    </linearGradient>
    <linearGradient id="meaiCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F4FF"/><stop offset="1" stop-color="#EBE3FE"/>
    </linearGradient>
    <linearGradient id="openaiCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F7F5"/>
    </linearGradient>
    <linearGradient id="claudeCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FDF5F1"/>
    </linearGradient>

    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A2540" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0A2540" flood-opacity="0.07"/>
    </filter>

    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10A37F"/>
    </marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97757"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/>
    </marker>

    <!-- Official brand marks as vector paths. -->
    <symbol id="logoDotnet" viewBox="0 0 24 24">
      <path fill="#512BD4" d="M24 8.77h-2.468v7.565h-1.425V8.77h-2.462V7.53H24zm-6.852 7.565h-4.821V7.53h4.63v1.24h-3.205v2.494h2.953v1.234h-2.953v2.604h3.396zm-6.708 0H8.882L4.78 9.863a2.896 2.896 0 0 1-.258-.51h-.036c.032.189.048.592.048 1.21v5.772H3.157V7.53h1.659l3.965 6.32c.167.261.275.442.323.54h.024c-.04-.233-.06-.629-.06-1.185V7.529h1.372zm-8.703-.693a.868.829 0 0 1-.869.829.868.829 0 0 1-.868-.83.868.829 0 0 1 .868-.828.868.829 0 0 1 .869.829Z"/>
    </symbol>
    <symbol id="logoOpenAI" viewBox="0 0 24 24">
      <path fill="#10A37F" d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/>
    </symbol>
    <symbol id="logoAnthropic" viewBox="0 0 24 24">
      <path fill="#191919" d="M17.3041 3.541h-3.6718l6.696 16.918H24Zm-10.6082 0L0 20.459h3.7442l1.3693-3.5527h7.0052l1.3693 3.5528h3.7442L10.5363 3.5409Zm-.3712 10.2232 2.2914-5.9456 2.2914 5.9456Z"/>
    </symbol>
    <symbol id="logoClaude" viewBox="0 0 24 24">
      <path fill="#D97757" d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/>
    </symbol>
    <symbol id="logoEntra" viewBox="0 0 24 24">
      <path fill="#0F8CE9" d="M12 2.2 2.4 20.4h4.3L12 9.6l5.3 10.8h4.3z"/>
      <path fill="#50E6FF" opacity=".85" d="M12 9.6 6.7 20.4h10.6z"/>
    </symbol>
  </defs>

  <rect width="1640" height="720" fill="url(#canvas)"/>

  <!-- Title -->
  <g transform="translate(820 58)" text-anchor="middle">
    <text y="0" font-size="34" font-weight="700" fill="#0A2540" letter-spacing="-0.4">
      One <tspan font-family="'Cascadia Code', Consolas, monospace" fill="#512BD4">IChatClient</tspan>. Two official SDKs. Two wire protocols.
    </text>
    <text y="34" font-size="16" fill="#5A6B7C">
      Microsoft.Extensions.AI fans one .NET call path out to Azure OpenAI and Claude on Microsoft Foundry
    </text>
  </g>

  <!-- App origin, deliberately subdued -->
  <g transform="translate(72 286)">
    <rect x="0" y="0" width="188" height="124" rx="16"
          fill="#FFFFFF" stroke="#D7E2ED" stroke-width="1.4" filter="url(#softShadow)"/>
    <use href="#logoDotnet" x="24" y="22" width="44" height="44"/>
    <text x="24" y="88" font-size="16" font-weight="700" fill="#0A2540">.NET 10 app</text>
    <text x="24" y="108" font-size="12.5" fill="#8A97A5">Blazor Server</text>
  </g>

  <!-- MEAI, the centrepiece -->
  <g transform="translate(348 200)">
    <rect x="0" y="0" width="320" height="296" rx="22"
          fill="url(#meaiCard)" stroke="#7C3AED" stroke-width="2" filter="url(#cardShadow)"/>

    <text x="160" y="42" text-anchor="middle" font-size="11.5" font-weight="700"
          fill="#7C3AED" letter-spacing="1.6">THE ABSTRACTION</text>

    <text x="160" y="80" text-anchor="middle" font-size="21" font-weight="700" fill="#0A2540">Microsoft.Extensions.AI</text>

    <rect x="46" y="102" width="228" height="46" rx="10" fill="#0A2540"/>
    <text x="160" y="132" text-anchor="middle"
          font-family="'Cascadia Code', Consolas, monospace" font-size="17" fill="#C4B5FD">IChatClient</text>

    <line x1="40" y1="174" x2="280" y2="174" stroke="#D9CCFA" stroke-width="1.2"/>

    <text x="160" y="201" text-anchor="middle" font-size="13.5" fill="#4A5A6A">One streaming loop, one history model,</text>
    <text x="160" y="222" text-anchor="middle" font-size="13.5" fill="#4A5A6A">one options and usage shape.</text>

    <g transform="translate(30 244)">
      <rect x="0" y="0" width="260" height="32" rx="8" fill="#FFFFFF" stroke="#D9CCFA"/>
      <text x="130" y="21" text-anchor="middle"
            font-family="'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#5B21B6">.AsBuilder().UseFunctionInvocation()</text>
    </g>
  </g>

  <!-- OpenAI lane -->
  <g transform="translate(806 138)">
    <rect x="0" y="0" width="764" height="216" rx="20"
          fill="url(#openaiCard)" stroke="#BFDCD1" stroke-width="1.6" filter="url(#cardShadow)"/>

    <use href="#logoOpenAI" x="34" y="42" width="52" height="52"/>
    <text x="104" y="62" font-size="21" font-weight="700" fill="#0A2540">OpenAI SDK for .NET</text>
    <text x="104" y="86" font-size="13" fill="#5A6B7C">NuGet: OpenAI &#183; Microsoft.Extensions.AI.OpenAI</text>

    <rect x="104" y="102" width="330" height="34" rx="8" fill="#0A2540"/>
    <text x="120" y="124" font-family="'Cascadia Code', Consolas, monospace" font-size="12.5" fill="#6EE7B7">GetResponsesClient().AsIChatClient()</text>

    <g transform="translate(104 150)">
      <rect x="0" y="0" width="148" height="28" rx="14" fill="#E6F6F0" stroke="#10A37F" stroke-width="1.2"/>
      <text x="74" y="19" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0B7A5F">Responses API</text>
      <text x="162" y="19" font-family="'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#6C7D8C">POST /openai/v1/responses</text>
    </g>

    <line x1="486" y1="42" x2="486" y2="176" stroke="#DCE7E3" stroke-width="1.2"/>

    <text x="520" y="60" font-size="11" font-weight="700" fill="#8A97A5" letter-spacing="1.4">DEPLOYED ON FOUNDRY</text>
    <text x="520" y="92" font-size="19" font-weight="700" fill="#0A2540">Azure OpenAI</text>
    <text x="520" y="115" font-size="13" fill="#5A6B7C">in Microsoft Foundry Models</text>
    <rect x="520" y="133" width="184" height="30" rx="8" fill="#F0F5F3" stroke="#C9DED7"/>
    <text x="612" y="153" text-anchor="middle"
          font-family="'Cascadia Code', Consolas, monospace" font-size="13" fill="#0B7A5F">gpt-5.6-sol</text>
  </g>

  <!-- Anthropic lane -->
  <g transform="translate(806 386)">
    <rect x="0" y="0" width="764" height="216" rx="20"
          fill="url(#claudeCard)" stroke="#EFD3C6" stroke-width="1.6" filter="url(#cardShadow)"/>

    <use href="#logoAnthropic" x="37" y="46" width="46" height="46"/>
    <text x="104" y="62" font-size="21" font-weight="700" fill="#0A2540">Anthropic C# SDK</text>
    <text x="104" y="86" font-size="13" fill="#5A6B7C">NuGet: Anthropic &#183; Anthropic.Foundry</text>

    <rect x="104" y="102" width="330" height="34" rx="8" fill="#0A2540"/>
    <text x="120" y="124" font-family="'Cascadia Code', Consolas, monospace" font-size="12.5" fill="#FBBF9C">AnthropicFoundryClient().AsIChatClient()</text>

    <g transform="translate(104 150)">
      <rect x="0" y="0" width="148" height="28" rx="14" fill="#FCEDE5" stroke="#D97757" stroke-width="1.2"/>
      <text x="74" y="19" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B4532F">Messages API</text>
      <text x="162" y="19" font-family="'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#6C7D8C">POST /anthropic/v1/messages</text>
    </g>

    <line x1="486" y1="42" x2="486" y2="176" stroke="#F0DED5" stroke-width="1.2"/>

    <text x="520" y="60" font-size="11" font-weight="700" fill="#8A97A5" letter-spacing="1.4">DEPLOYED ON FOUNDRY</text>
    <use href="#logoClaude" x="520" y="72" width="28" height="28"/>
    <text x="558" y="92" font-size="19" font-weight="700" fill="#0A2540">Claude</text>
    <text x="520" y="115" font-size="13" fill="#5A6B7C">in Microsoft Foundry &#183; Hosted on Azure</text>
    <rect x="520" y="133" width="184" height="30" rx="8" fill="#FBF0EA" stroke="#EBD0C2"/>
    <text x="612" y="153" text-anchor="middle"
          font-family="'Cascadia Code', Consolas, monospace" font-size="13" fill="#B4532F">claude-opus-5</text>
  </g>

  <!-- App into MEAI -->
  <g fill="none" stroke="#9A8BC4" stroke-width="2.2" marker-end="url(#arrowViolet)">
    <path d="M266 348 L340 348"/>
  </g>

  <!-- MEAI fans out to both lanes -->
  <g fill="none" stroke-width="2.4">
    <path d="M672 300 C 730 300 742 246 798 246" stroke="#10A37F" marker-end="url(#arrowGreen)"/>
    <path d="M672 396 C 730 396 742 494 798 494" stroke="#D97757" marker-end="url(#arrowCoral)"/>
  </g>

  <!-- Shared keyless auth, seated between the two fan-out curves -->
  <g transform="translate(680 328)">
    <rect x="0" y="0" width="118" height="40" rx="20" fill="#FFFFFF" stroke="#BBD9F5" stroke-width="1.4" filter="url(#softShadow)"/>
    <use href="#logoEntra" x="12" y="9" width="22" height="22"/>
    <text x="42" y="25" font-size="12.5" font-weight="700" fill="#0A2540">Entra ID</text>
  </g>

  <!-- Footer -->
  <g transform="translate(820 662)" text-anchor="middle">
    <text font-size="14.5" fill="#5A6B7C">
      <tspan font-weight="700" fill="#0A2540">Swap models without rewriting the app</tspan>
      <tspan dx="10">&#183;</tspan>
      <tspan dx="10" font-weight="700" fill="#0A2540">No API keys</tspan>, managed identity only
      <tspan dx="10">&#183;</tspan>
      <tspan dx="10" font-weight="700" fill="#0A2540">One</tspan><tspan font-family="'Cascadia Code', Consolas, monospace" fill="#0A2540"> azd up</tspan>
    </text>
  </g>
</svg>
