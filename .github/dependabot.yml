version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # MEAI.OpenAI 10.9 requires OpenAI >= 2.12.0 and < 2.13.0.
      - dependency-name: OpenAI
        versions:
          - ">= 2.13.0"
    groups:
      dotnet:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
