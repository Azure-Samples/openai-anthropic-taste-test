name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore OpenAIAnthropicTasteTest.slnx
      - name: Build
        run: dotnet build OpenAIAnthropicTasteTest.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test OpenAIAnthropicTasteTest.slnx --configuration Release --no-build
      - name: Build container
        run: docker build --file src/TasteTest/Dockerfile --tag taste-test:ci src/TasteTest
