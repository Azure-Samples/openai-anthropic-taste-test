name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore OpenAIAnthropicTasteTest.slnx
      - name: Build
        run: dotnet build OpenAIAnthropicTasteTest.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test OpenAIAnthropicTasteTest.slnx --configuration Release --no-build
